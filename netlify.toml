[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Event function: netlify/functions/submission-created.js emails each
# Netlify Forms lead via Resend (needs RESEND_API_KEY env var).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Common un-hyphenated typos of community slugs.
[[redirects]]
  from = "/portwashington"
  to = "/port-washington"
  status = 301
[[redirects]]
  from = "/glenhead"
  to = "/glen-head"
  status = 301
[[redirects]]
  from = "/glenwoodlanding"
  to = "/glenwood-landing"
  status = 301
[[redirects]]
  from = "/easthills"
  to = "/east-hills"
  status = 301
[[redirects]]
  from = "/homevaluation"
  to = "/home-valuation"
  status = 301

# East Hills shares the Roslyn guide (src/data/guides.js `alsoFor`).
[[redirects]]
  from = "/east-hills/buyers-guide"
  to = "/roslyn/buyers-guide"
  status = 301

# Every route is prerendered to its own HTML file at build time
# (scripts/prerender.mjs), so anything that reaches this rule is a real 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts never change in place; rename the file if the font is ever updated.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
