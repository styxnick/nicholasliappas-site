<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nicholas Liappas | Compass Real Estate Agent | North Shore, Queens & North Fork</title>
    <meta name="description" content="Nicholas Liappas is a Licensed Associate Real Estate Broker at Compass specializing in residential, commercial, and development sales across Long Island's North Shore, Queens, and the North Fork. Built Different, Sold Better." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://www.googletagmanager.com" />

    <!-- Self-hosted variable fonts (latin subsets of Google's Inter + Cormorant Garamond, in public/fonts/).
         Replaces the render-blocking Google Fonts stylesheet. Both are used above the fold on every page. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('/fonts/cormorant-garamond-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <script>
      // Homepage only: preload the hero poster (the largest paint) before the app bundle runs.
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.href = '/video/colonial-home-loop-poster.jpg'; l.fetchPriority = 'high';
        document.head.appendChild(l);
      }
    </script>
    <style>
      /* Global focus ring: visible on both light and dark backgrounds. All other styling is inline (src/components/styles.js). */
      :focus-visible { outline: 2px solid #1a1a1a; outline-offset: 2px; box-shadow: 0 0 0 4px #fff; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
      /* Breakpoints that must be right before React hydrates the prerendered HTML
         (src/components/Nav.jsx, src/pages/Commercial.jsx). Keep in sync with their comments. */
      .nav-desktop { display: contents; }
      .nav-mobile { display: none; }
      @media (max-width: 1100px) { .nav-desktop { display: none; } .nav-mobile { display: flex; } }
      .eyebrow-sm { letter-spacing: 4px; }
      .split-a { grid-template-columns: 1fr 1.4fr; }
      .split-b { grid-template-columns: 1fr 1fr; }
      .split-c { grid-template-columns: 1fr 1.3fr; }
      @media (max-width: 640px) { .eyebrow-sm { letter-spacing: 2px; } .split-a, .split-b, .split-c { grid-template-columns: 1fr; } }
    </style>

    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=yes" />
    <meta name="apple-mobile-web-app-title" content="Nicholas Liappas" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Site-wide social defaults; per-route title/description/url/canonical are set in src/lib/seo.js -->
    <meta property="og:site_name" content="Nicholas Liappas – The Liappas Team at Compass" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://nicholasliappas.com/nicholas-headshot.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1601" />
    <meta property="og:image:alt" content="Nicholas Liappas – Licensed Associate Real Estate Broker at Compass" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nickliappas" />
    <meta name="twitter:creator" content="@nickliappas" />
    <meta name="twitter:image" content="https://nicholasliappas.com/nicholas-headshot.jpg" />
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="interest">
        <option value="buying">Buying a Home</option>
        <option value="selling">Selling a Property</option>
        <option value="both">Buying & Selling</option>
        <option value="valuation">Home Valuation</option>
        <option value="investing">Investment Properties</option>
        <option value="relocation">Relocation Services</option>
        <option value="commercial">Commercial Property</option>
      </select>
      <!-- First-touch attribution, filled by src/lib/netlifyForms.jsx -->
      <input type="hidden" name="landing_page" />
      <input type="hidden" name="source" />
      <input type="hidden" name="medium" />
      <input type="hidden" name="campaign" />
      <input type="hidden" name="referrer_url" />
    </form>

    <!-- Hidden form for Home Valuation -->
    <form name="home-valuation" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="address" />
      <input type="text" name="zipCode" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <!-- First-touch attribution, filled by src/lib/netlifyForms.jsx -->
      <input type="hidden" name="landing_page" />
      <input type="hidden" name="source" />
      <input type="hidden" name="medium" />
      <input type="hidden" name="campaign" />
      <input type="hidden" name="referrer_url" />
    </form>

    <!-- Hidden form for Commercial inquiries (/commercial) -->
    <form name="commercial" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="role" />
      <input type="text" name="propertyType" />
      <input type="text" name="location" />
      <input type="text" name="size" />
      <input type="text" name="timeline" />
      <textarea name="message"></textarea>
      <!-- First-touch attribution, filled by src/lib/netlifyForms.jsx -->
      <input type="hidden" name="landing_page" />
      <input type="hidden" name="source" />
      <input type="hidden" name="medium" />
      <input type="hidden" name="campaign" />
      <input type="hidden" name="referrer_url" />
    </form>

    <!-- Hidden form for Buyer's Guide requests (src/components/GuideForm.jsx) -->
    <form name="buyers-guide" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="town" />
      <input type="text" name="guide" />
      <!-- First-touch attribution, filled by src/lib/netlifyForms.jsx -->
      <input type="text" name="landing_page" />
      <input type="text" name="source" />
      <input type="text" name="medium" />
      <input type="text" name="campaign" />
      <input type="text" name="referrer_url" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
